[project]
name = "qerayet-el-fengan"
version = "0.1.0"
description = "Open-source strategy lab and dashboard for the Egyptian Exchange (EGX) on Younit by EFG Hermes"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Omar Nassar" }]
dependencies = [
    "mcp[cli]>=1.2,<2",  # 1.x FastMCP API; 2.x renamed it to MCPServer
    "pydantic>=2.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29"]
# Live mode: install the official SDK from source (not on PyPI yet), e.g.
#   pip install ../younit-python-master
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
# Named fengan-* so they never clash with the official SDK's own `younit-mcp` command.
fengan-mcp = "fengan.server:main"
fengan-dashboard = "fengan.api:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fengan"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
